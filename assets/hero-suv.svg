 <filter id="glow"><feGaussianBlur stdDeviation="19"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
 <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#6ebfd1" opacity=".23"/></pattern>
