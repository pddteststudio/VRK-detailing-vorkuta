 <linearGradient id="body" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#c6d4de"/><stop offset=".15" stop-color="#5a7081"/><stop offset=".36" stop-color="#253440"/><stop offset=".7" stop-color="#111b27"/><stop offset="1" stop-color="#3c5666"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#233b4e"/><stop offset=".28" stop-color="#071521"/><stop offset=".65" stop-color="#18394b"/><stop offset="1" stop-color="#050c16"/></linearGradient>
 <linearGradient id="bump" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#708696"/><stop offset=".3" stop-color="#233541"/><stop offset=".6" stop-color="#090f18"/><stop offset="1" stop-color="#385666"/></linearGradient>
 <linearGradient id="road" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#1c3c4a" stop-opacity=".8"/><stop offset="1" stop-color="#081019" stop-opacity="0"/></linearGradient>
